<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>smmhy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    body { font-family: system-ui, sans-serif; background: #12121a; color: #eee; max-width: 760px; margin: 0 auto; padding: 24px; }
    button, input { font-size: 1rem; padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #1e1e2a; color: #eee; }
    button { cursor: pointer; background: #6c4cf1; border: none; }
    button.secundario { background: #2a2a3a; }
    .linha { display: flex; gap: 8px; }
    .linha input { flex: 1; }
    .centro { text-align: center; }
    #auth, #sala, #usuario, #entrar, #campoFoto { display: none; }
    #auth label { display: block; margin: 12px 0 4px; }
    #auth input { width: 100%; box-sizing: border-box; }
    #auth button { margin-top: 12px; }
    #erroAuth { color: #ff7b7b; min-height: 1.5em; }
    #avisoPerfil { text-align: center; color: #ffb86c; min-height: 1.5em; }
    #aviso { color: #ffb86c; min-height: 1.5em; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #6c4cf1; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }

    #usuario { flex-direction: column; align-items: center; text-align: center; gap: 10px; margin: 8px 0 16px; }
    #usuario #perfil .avatar { width: 224px; height: 224px; font-size: 5.5rem; border: 4px solid #12121a; box-shadow: 0 0 0 4px #9b7bff, 0 12px 40px rgba(108, 76, 241, 0.45); }
    #ola { margin: 8px 0 0; opacity: 0.7; }
    #saudacao { font-family: "Pacifico", "Brush Script MT", cursive; font-size: 3rem; line-height: 1.15; color: #fff; text-shadow: 0 2px 18px rgba(155, 123, 255, 0.55); overflow-wrap: anywhere; }
    .botoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #entrar { font-size: 1.2rem; padding: 14px 32px; margin-top: 8px; }

    #usuario.compacto { flex-direction: row; text-align: left; gap: 12px; margin: 0 0 8px; flex-wrap: wrap; }
    #usuario.compacto #perfil .avatar { width: 48px; height: 48px; font-size: 1.4rem; border-width: 2px; box-shadow: 0 0 0 2px #9b7bff; }
    #usuario.compacto #ola { display: none; }
    #usuario.compacto #saudacao { font-size: 1.5rem; }

    .video { aspect-ratio: 16 / 9; width: 100%; margin-top: 8px; }
    .video iframe { width: 100%; height: 100%; }
    .agora { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 12px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: #1a1a26; border-radius: 8px; margin-bottom: 6px; }
    li .info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    li button { padding: 4px 10px; background: #3a2a3a; }
  </style>
</head>
<body>
  <h1>🎵 smmhy</h1>
  <p id="status">Conectando...</p>

  <div id="auth">
    <h2 id="tituloAuth">Entrar</h2>
    <form id="formAuth">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required />
      <div id="campoNick">
        <label for="nick">Nick</label>
        <input id="nick" maxlength="20" autocomplete="nickname" />
      </div>
      <div id="campoFoto">
        <label for="foto">Foto de perfil (opcional, até 5 MB)</label>
        <input id="foto" type="file" accept="image/jpeg,image/png,image/webp" />
      </div>
      <label for="senha">Senha</label>
      <input id="senha" type="password" minlength="8" maxlength="72" autocomplete="current-password" required />
      <button id="enviarAuth" type="submit">Entrar</button>
    </form>
    <p id="erroAuth" role="alert"></p>
    <button id="trocarAuth" class="secundario" type="button">Criar uma conta</button>
  </div>

  <div id="usuario">
    <span id="perfil"></span>
    <div>
      <p id="ola">Olá,</p>
      <div id="saudacao"></div>
    </div>
    <div class="botoes">
      <button id="trocarFotoBtn" class="secundario" type="button">Trocar foto</button>
      <button id="removerFoto" class="secundario" type="button">Remover foto</button>
      <button id="sair" class="secundario" type="button">Sair</button>
    </div>
    <input id="trocarFoto" type="file" accept="image/jpeg,image/png,image/webp" hidden />
  </div>
  <p id="avisoPerfil" role="status"></p>
  <div class="centro"><button id="entrar" type="button">Entrar na sala</button></div>

  <div id="sala">
    <div class="linha">
      <input id="link" placeholder="Cole um link de vídeo ou playlist do YouTube" aria-label="Link do YouTube" />
      <button id="adicionar">Adicionar</button>
    </div>
    <p id="aviso" role="status"></p>
    <div class="video"><div id="player"></div></div>
    <p id="agora" class="agora"></p>
    <button id="pular" class="secundario">⏭ Pular</button>
    <h2>Fila</h2>
    <ul id="fila"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
